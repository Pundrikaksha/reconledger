[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconledger"
version = "0.1.0"
description = "Human-approved AI triage agent for sandboxed security assessments"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["fpdf2>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]

[project.scripts]
reconledger = "reconledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reconledger.web" = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
